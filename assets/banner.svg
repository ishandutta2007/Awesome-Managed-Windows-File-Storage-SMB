<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowBlue" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <style>
      @keyframes floatPulse {
        0% { transform: translateY(0px); opacity: 0.4; }
        50% { transform: translateY(-8px); opacity: 0.8; }
        100% { transform: translateY(0px); opacity: 0.4; }
      }
      @keyframes gridSlide {
        0% { transform: translateY(0px); }
        100% { transform: translateY(40px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      .animated-grid {
        animation: gridSlide 12s linear infinite;
      }
      .glowing-orb {
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .floating-pill {
        animation: floatPulse 4s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: url(#titleGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #e2e8f0;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="400" rx="16" fill="url(#glowBlue)" class="glowing-orb"/>
  <rect width="1200" height="400" rx="16" fill="url(#glowPurple)" class="glowing-orb"/>

  <!-- Background Decorative Grid (Dynamic Flow under foreground) -->
  <g opacity="0.12" class="animated-grid">
    <path d="M0,0 L1200,0 M0,40 L1200,40 M0,80 L1200,80 M0,120 L1200,120 M0,160 L1200,160 M0,200 L1200,200 M0,240 L1200,240 M0,280 L1200,280 M0,320 L1200,320 M0,360 L1200,360 M0,400 L1200,400" stroke="#38bdf8" stroke-width="1"/>
    <path d="M0,0 L0,400 M80,0 L80,400 M160,0 L160,400 M240,0 L240,400 M320,0 L320,400 M400,0 L400,400 M480,0 L480,400 M560,0 L560,400 M640,0 L640,400 M720,0 L720,400 M800,0 L800,400 M880,0 L880,400 M960,0 L960,400 M1040,0 L1040,400 M1120,0 L1120,400" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- Dynamic Graphic Accents (Positioned below text so title stays clean in foreground) -->
  <g opacity="0.25">
    <circle cx="1020" cy="120" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="1020" cy="120" r="90" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  </g>

  <!-- Tech Feature Pills (Floating Background Decorative Elements) -->
  <g opacity="0.6">
    <rect x="760" y="270" width="120" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" class="floating-pill" style="animation-delay: 0s;"/>
    <text x="820" y="292" text-anchor="middle" class="pill-text">SMB 3.1.1</text>

    <rect x="900" y="270" width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" class="floating-pill" style="animation-delay: 1s;"/>
    <text x="970" y="292" text-anchor="middle" class="pill-text" fill="#818cf8">Active Directory</text>

    <rect x="1060" y="270" width="100" height="34" rx="17" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" class="floating-pill" style="animation-delay: 2s;"/>
    <text x="1110" y="292" text-anchor="middle" class="pill-text" fill="#c084fc">Samba VFS</text>
  </g>

  <!-- FOREGROUND MAIN CONTENT (Title and Subtitle stay crisp & unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Icon / Tag Badge -->
    <rect x="0" y="70" width="220" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="91" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#38bdf8" letter-spacing="1">WINDOWS FILE STORAGE</text>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text" font-size="44" letter-spacing="-0.5">Awesome Managed Windows File Storage</text>

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle-text" font-size="20">Curated SaaS Platforms, Self-Hosted NAS &amp; Open-Source SMB File Servers</text>

    <!-- Feature Bullet Line -->
    <text x="0" y="265" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">
      ⚡ AWS FSx &amp; Azure Files &nbsp;•&nbsp; 🐧 Samba, KSMBD &amp; Ceph &nbsp;•&nbsp; 💾 High Performance Cloud NAS
    </text>
  </g>
</svg>
