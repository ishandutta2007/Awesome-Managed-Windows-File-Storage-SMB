<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Radial Accent 1 -->
    <radialGradient id="glowBlue" cx="15%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Radial Accent 2 -->
    <radialGradient id="glowPurple" cx="85%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Animated Glowing Orbs (Native SVG animate) -->
  <rect width="1200" height="400" rx="16" fill="url(#glowBlue)">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="400" rx="16" fill="url(#glowPurple)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200 M0,320 H1200 M0,360 H1200"/>
    <path d="M80,0 V400 M160,0 V400 M240,0 V400 M320,0 V400 M400,0 V400 M480,0 V400 M560,0 V400 M640,0 V400 M720,0 V400 M800,0 V400 M880,0 V400 M960,0 V400 M1040,0 V400 M1120,0 V400"/>
  </g>

  <!-- Background Circles Dynamic Aspect -->
  <g transform="translate(1000, 150)" opacity="0.25">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative Pills (Positioned in right side background) -->
  <g>
    <!-- Pill 1 -->
    <g transform="translate(760, 270)">
      <rect width="120" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">SMB 3.1.1</text>
      <animateTransform attributeName="transform" type="translate" values="760,270; 760,264; 760,270" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(895, 270)">
      <rect width="145" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="72" y="22" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#818cf8">Active Directory</text>
      <animateTransform attributeName="transform" type="translate" values="895,270; 895,262; 895,270" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(1055, 270)">
      <rect width="105" height="34" rx="17" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="52" y="22" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#c084fc">Samba VFS</text>
      <animateTransform attributeName="transform" type="translate" values="1055,270; 1055,263; 1055,270" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- FOREGROUND MAIN CONTENT (Title and Subtitle stay crisp & clear) -->
  <g transform="translate(70, 0)">
    <!-- Tag Badge -->
    <g transform="translate(0, 70)">
      <rect width="220" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="110" y="21" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1">WINDOWS FILE STORAGE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="42" fill="url(#titleGrad)" letter-spacing="-0.5">Awesome Managed Windows File Storage</text>

    <!-- Subtitle -->
    <text x="0" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#e2e8f0">Curated SaaS Platforms, Self-Hosted NAS &amp; Open-Source SMB File Servers</text>

    <!-- Highlights Line -->
    <text x="0" y="265" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">
      AWS FSx &amp; Azure Files &nbsp;&bull;&nbsp; Samba, KSMBD &amp; Ceph &nbsp;&bull;&nbsp; High Performance Cloud NAS
    </text>
  </g>
</svg>
