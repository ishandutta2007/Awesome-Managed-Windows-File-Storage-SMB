<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Canvas & Background -->
  <rect width="1200" height="400" fill="url(#bg-glow)" />
  <rect width="1200" height="400" fill="url(#grid-pattern)" />

  <!-- DYNAMIC & ANIMATED BACKGROUND ELEMENTS (Z-INDEX: LOW) -->

  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="100" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow-heavy)">
    <animate attributeName="cy" values="100;140;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1000" cy="300" r="220" fill="#2563eb" opacity="0.1" filter="url(#glow-heavy)">
    <animate attributeName="cy" values="300;260;300" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Data Flow Rays -->
  <g opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10 15">
      <animate attributeName="stroke-dashoffset" from="500" to="0" dur="15s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#3b82f6" stroke-width="1" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="0" to="500" dur="20s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Flowing Network Nodes (Placed safely on left & right sides) -->
  <g opacity="0.35">
    <!-- Left Server Node Graphic -->
    <g transform="translate(90, 150)">
      <rect x="0" y="0" width="90" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <line x1="15" y1="25" x2="75" y2="25" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="50" x2="75" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="75" x2="55" y2="75" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="70" cy="75" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Right Cloud Storage Graphic -->
    <g transform="translate(1020, 150)">
      <rect x="0" y="0" width="90" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <path d="M 25 45 Q 25 30 40 30 Q 50 20 65 30 Q 75 30 75 45 Q 80 55 70 65 L 25 65 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="35" cy="80" r="3" fill="#38bdf8"/>
      <circle cx="50" cy="80" r="3" fill="#38bdf8"/>
      <circle cx="65" cy="80" r="3" fill="#22c55e">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- FOREGROUND CONTENT & HEADERS (Z-INDEX: HIGH - GUARANTEED READABILITY) -->

  <!-- Subtle Backdrop Card for Center Title to guarantee maximum crisp contrast -->
  <rect x="250" y="50" width="700" height="300" rx="16" fill="#0f172a" opacity="0.6" stroke="#1e293b" stroke-width="1" />

  <!-- Windows & SMB File Storage Icon / Badge -->
  <g transform="translate(600, 105)" filter="url(#glow-light)">
    <circle cx="0" cy="0" r="28" fill="#0284c7" opacity="0.2"/>
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Windows-like storage grid symbol -->
    <path d="M -9 -9 L -2 -9 L -2 -2 L -9 -2 Z M 2 -9 L 9 -9 L 9 -2 L 2 -2 Z M -9 2 L -2 2 L -2 9 L -9 9 Z M 2 2 L 9 2 L 9 9 L 2 9 Z" fill="#38bdf8"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="180" text-anchor="middle" fill="url(#title-grad)" font-size="34" font-weight="800" letter-spacing="-0.5">
    Awesome Managed Windows File Storage
  </text>

  <!-- Protocol / Focus Subtitle Pills -->
  <g transform="translate(600, 220)">
    <text x="0" y="0" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="600" letter-spacing="3">
      SMB 3.1.1  •  CIFS  •  AZURE FILES  •  AWS FSx  •  KSMBD
    </text>
  </g>

  <!-- Description Subtitle -->
  <text x="600" y="260" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="400">
    Curated list of enterprise SaaS, cloud NAS, self-hosted servers &amp; protocol specs
  </text>

  <!-- Feature Highlights / Tags Footer -->
  <g transform="translate(600, 305)">
    <!-- Tag 1 -->
    <g transform="translate(-190, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="500">⚡ High Performance</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">🛡️ Active Directory</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(190, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="500">☁️ Multi-Cloud NAS</text>
    </g>
  </g>

</svg>
