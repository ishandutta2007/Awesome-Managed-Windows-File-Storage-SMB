<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent Gradient 2 -->
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
    }
    
    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    .bg-node-1 { animation: pulse 6s ease-in-out infinite; transform-origin: 200px 80px; }
    .bg-node-2 { animation: pulse 8s ease-in-out infinite 2s; transform-origin: 1000px 240px; }
    .animated-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
    .floating-card-1 { animation: float1 5s ease-in-out infinite; }
    .floating-card-2 { animation: float2 6s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" />
    <path d="M80 0 V320 M160 0 V320 M240 0 V320 M320 0 V320 M400 0 V320 M480 0 V320 M560 0 V320 M640 0 V320 M720 0 V320 M800 0 V320 M880 0 V320 M960 0 V320 M1040 0 V320 M1120 0 V320" />
  </g>

  <!-- Dynamic / Animated Background Graphical Elements -->
  <g class="bg-node-1">
    <circle cx="200" cy="80" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  </g>
  <g class="bg-node-2">
    <circle cx="1000" cy="240" r="140" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Dynamic Connecting Network Lines (Behind Text) -->
  <g opacity="0.35" stroke="#a855f7" stroke-width="2">
    <line x1="150" y1="260" x2="350" y2="280" class="animated-line" />
    <line x1="850" y1="60" x2="1050" y2="100" class="animated-line" />
  </g>

  <!-- Decorative Flow Badges / Floating Elements (Positioned away from center text) -->
  <g class="floating-card-1" transform="translate(60, 50)">
    <rect width="140" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#38bdf8" />
    <text x="36" y="23" class="badge-text">AWS RAM</text>
  </g>

  <g class="floating-card-2" transform="translate(1000, 45)">
    <rect width="140" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="36" y="23" class="badge-text">Crossplane</text>
  </g>

  <g class="floating-card-1" transform="translate(980, 230)">
    <rect width="150" height="36" rx="18" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#f43f5e" />
    <text x="36" y="23" class="badge-text">Terragrunt</text>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad1)" />

  <!-- Center Text Content (Ensured to remain clearly in foreground) -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <!-- Main Title -->
    <text y="0" class="title" filter="url(#glow)">Awesome Multi-Account Resource Sharing 🌐</text>

    <!-- Subtitle -->
    <text y="42" class="subtitle">Curated Multi-Cloud Access, Infrastructure Governance & Cross-Account Orchestration</text>
  </g>

  <!-- Bottom Tech Pills Bar -->
  <g transform="translate(600, 250)" text-anchor="middle">
    <rect x="-310" y="-18" width="620" height="36" rx="18" fill="#0f172a" stroke="#475569" stroke-width="1" opacity="0.8" />
    <text y="5" class="badge-text" fill="#94a3b8">
      ☁️ AWS RAM  |  🛡️ Azure Policy  |  ⚡ GCP IAM  |  📦 OpenTofu  |  🔒 OPA Policy
    </text>
  </g>
</svg>
